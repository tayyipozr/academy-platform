spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: academy:test:session

app:
  bootstrap:
    enabled: true
    organization-name: Test Academy
    organization-slug: test-academy
    admin-email: admin@test.com
    admin-password: TestAdministrator123!
    admin-first-name: Test
    admin-last-name: Administrator

logging:
  level:
    root: WARN
    com.academy.platform: INFO