spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:30m}
    redis:
      namespace: academy:session

server:
  port: 8080
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        name: ACADEMY_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.academy.platform: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

app:
  bootstrap:
    enabled: false

  session:
    cookie-name: ACADEMY_SESSION
    secure-cookie: true

  media:
    internal-endpoint: ${MEDIA_INTERNAL_ENDPOINT:http://minio:9000}
    public-endpoint: ${MEDIA_PUBLIC_ENDPOINT}
    region: ${MEDIA_REGION:us-east-1}
    bucket: ${MEDIA_BUCKET}
    access-key: ${MEDIA_ACCESS_KEY}
    secret-key: ${MEDIA_SECRET_KEY}
    path-style-access: true
    auto-create-bucket: false

    upload-url-duration: 15m
    download-url-duration: 5m

    maximum-image-size: 20971520
    maximum-video-size: 524288000
    maximum-document-size: 26214400

  reports:
    retention: ${REPORT_RETENTION:30d}
    download-url-duration: ${REPORT_DOWNLOAD_URL_DURATION:5m}

    executor:
      core-pool-size: ${REPORT_EXECUTOR_CORE_POOL_SIZE:2}
      maximum-pool-size: ${REPORT_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${REPORT_EXECUTOR_QUEUE_CAPACITY:100}
