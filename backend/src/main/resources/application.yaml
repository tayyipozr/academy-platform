spring:
  application:
    name: academy-platform-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:academy_platform}
    username: ${DB_USER:academy_user}
    password: ${DB_PASSWORD:academy_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2s

  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: academy:session

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: ACADEMY_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.academy.platform: DEBUG

app:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    organization-name: ${BOOTSTRAP_ORGANIZATION_NAME:Demo Academy}
    organization-slug: ${BOOTSTRAP_ORGANIZATION_SLUG:demo-academy}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:System}
    admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Administrator}

  media:
    internal-endpoint: ${MEDIA_INTERNAL_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MEDIA_PUBLIC_ENDPOINT:http://localhost:9000}

    region: ${MEDIA_REGION:us-east-1}
    bucket: ${MEDIA_BUCKET:academy-media}

    access-key: ${MEDIA_ACCESS_KEY:academy_minio}
    secret-key: ${MEDIA_SECRET_KEY:change-this-local-minio-password}

    path-style-access: ${MEDIA_PATH_STYLE:true}
    auto-create-bucket: ${MEDIA_AUTO_CREATE_BUCKET:true}

    upload-url-duration: 15m
    download-url-duration: 5m

    maximum-image-size: 20971520
    maximum-video-size: 524288000
    maximum-document-size: 26214400

  reports:
    retention: ${REPORT_RETENTION:30d}
    download-url-duration: ${REPORT_DOWNLOAD_URL_DURATION:5m}

    executor:
      core-pool-size: ${REPORT_EXECUTOR_CORE_POOL_SIZE:2}
      maximum-pool-size: ${REPORT_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${REPORT_EXECUTOR_QUEUE_CAPACITY:100}