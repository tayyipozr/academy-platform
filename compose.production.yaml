services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - postgres-production-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - academy-internal

    redis:
      image: redis:7-alpine
      restart: unless-stopped

      secrets:
        - redis_password

      command:
        - /bin/sh
        - -c
        - |
          exec redis-server \
            --appendonly yes \
            --appendfsync everysec \
            --requirepass "$$(cat /run/secrets/redis_password)"

      volumes:
        - redis-production-data:/data

      healthcheck:
        test: [ "CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG" ]
        interval: 10s
        timeout: 5s
        retries: 10

      networks:
        - academy-internal"

    minio:
      image: quay.io/minio/minio:latest
      restart: unless-stopped

      secrets:
        - minio_access_key
        - minio_secret_key

      entrypoint:
        - /bin/sh
        - -c

      command:
        - |
          export MINIO_ROOT_USER="$$(cat /run/secrets/minio_access_key)"
          export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_secret_key)"

          exec minio server \
            /data \
            --console-address ":9001"

      volumes:
        - minio-production-data:/data

      healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
        interval: 10s
        timeout: 5s
        retries: 20
      networks:
        - academy-internal

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    secrets:
      - minio_access_key
      - minio_secret_key

    environment:
      MEDIA_BUCKET: ${MEDIA_BUCKET}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        ACCESS_KEY="$$(cat /run/secrets/minio_access_key)"
        SECRET_KEY="$$(cat /run/secrets/minio_secret_key)"

        mc alias set local \
          http://minio:9000 \
          "$${ACCESS_KEY}" \
          "$${SECRET_KEY}"

        mc mb --ignore-existing \
          "local/$${MEDIA_BUCKET}"

        mc anonymous set none \
          "local/$${MEDIA_BUCKET}"  

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/postgres_password

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DATABASE: ${REDIS_DATABASE}
      REDIS_PASSWORD_FILE: /run/secrets/redis_password

      MEDIA_INTERNAL_ENDPOINT: ${MEDIA_INTERNAL_ENDPOINT}
      MEDIA_PUBLIC_ENDPOINT: ${MEDIA_PUBLIC_ENDPOINT}
      MEDIA_REGION: ${MEDIA_REGION}
      MEDIA_BUCKET: ${MEDIA_BUCKET}

      MEDIA_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MEDIA_SECRET_KEY_FILE: /run/secrets/minio_secret_key

      SESSION_TIMEOUT: ${SESSION_TIMEOUT}
      COOKIE_SECURE: "true"
      BOOTSTRAP_ENABLED: "false"

      JAVA_OPTS: ${JAVA_OPTS}

      expose:
        - "8080"

      healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness" ]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 30s

      networks:
        - academy-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    expose:
      - "3000"

    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10

    networks:
      - academy-internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_healthy

      backend:
        condition: service_healthy

      minio:
        condition: service_healthy

    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./infrastructure/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro

      - ./infrastructure/certbot/conf:/etc/letsencrypt:ro
      - ./infrastructure/certbot/www:/var/www/certbot:ro

    networks:
      - academy-internal

  certbot:
    image: certbot/certbot:latest
    restart: "no"

    volumes:
      - ./infrastructure/certbot/conf:/etc/letsencrypt
      - ./infrastructure/certbot/www:/var/www/certbot

    networks:
      - academy-internal

volumes:
  postgres-production-data:
  redis-production-data:
  minio-production-data:

networks:
  academy-internal:
    driver: bridge

secrets:
  postgres_password:
    file: ./infrastructure/secrets/postgres_password.txt

  redis_password:
    file: ./infrastructure/secrets/redis_password.txt

  minio_access_key:
    file: ./infrastructure/secrets/minio_access_key.txt

  minio_secret_key:
    file: ./infrastructure/secrets/minio_secret_key.txt
