services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-production-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - academy-internal


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]

    volumes:
      - redis-production-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - academy-internal


  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    command:
      server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio-production-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 20

    networks:
      - academy-internal


  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET}

    entrypoint: >
      /bin/sh -c "
      mc alias set local
      http://minio:9000
      $$MINIO_ROOT_USER
      $$MINIO_ROOT_PASSWORD;

      mc mb --ignore-existing
      local/$$MEDIA_BUCKET;

      mc anonymous set none
      local/$$MEDIA_BUCKET;

      exit 0;
      "

    networks:
      - academy-internal


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DATABASE: ${REDIS_DATABASE}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MEDIA_INTERNAL_ENDPOINT: ${MEDIA_INTERNAL_ENDPOINT}
      MEDIA_PUBLIC_ENDPOINT: ${MEDIA_PUBLIC_ENDPOINT}
      MEDIA_REGION: ${MEDIA_REGION}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY}

      SESSION_TIMEOUT: ${SESSION_TIMEOUT}

      REPORT_RETENTION: ${REPORT_RETENTION}
      REPORT_DOWNLOAD_URL_DURATION: ${REPORT_DOWNLOAD_URL_DURATION}

      REPORT_EXECUTOR_CORE_POOL_SIZE:
        ${REPORT_EXECUTOR_CORE_POOL_SIZE}

      REPORT_EXECUTOR_MAX_POOL_SIZE:
        ${REPORT_EXECUTOR_MAX_POOL_SIZE}

      REPORT_EXECUTOR_QUEUE_CAPACITY:
        ${REPORT_EXECUTOR_QUEUE_CAPACITY}

      COOKIE_SECURE: "true"
      BOOTSTRAP_ENABLED: "false"

      JAVA_OPTS: ${JAVA_OPTS}

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health/readiness"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - academy-internal


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:3000 || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

    networks:
      - academy-internal


  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_healthy

      backend:
        condition: service_healthy

      minio:
        condition: service_healthy

    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}

    ports:
      - "80:80"

    volumes:
      - ./infrastructure/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

    networks:
      - academy-internal


volumes:
  postgres-production-data:
  redis-production-data:
  minio-production-data:


networks:
  academy-internal:
    driver: bridge
